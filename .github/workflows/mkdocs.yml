name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Validate tools.yml against schema
        run: python scripts/validate_manifests.py
      - name: Pressure-test the validator (29 stress tests)
        run: python scripts/pressure_test_manifest.py
      - name: Check live URLs resolve
        id: url-check
        continue-on-error: true
        run: python scripts/check_live_urls.py
      - name: Report URL failures
        if: steps.url-check.outcome == 'failure'
        run: echo "::warning::One or more live URLs failed health check. See log above."

  build:
    needs: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material mkdocs-minify-plugin
      - run: pip install -r scripts/requirements.txt

      - name: Assemble public documentation
        run: python scripts/assemble_content.py

      - run: mkdocs build

      - name: Copy Google Search Console verification
        run: cp googleacea638aeb4140cf.html _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
